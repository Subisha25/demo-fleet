<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="ffGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="50%" stop-color="#C04E24"/>
      <stop offset="100%" stop-color="#8C3211"/>
    </linearGradient>
    <linearGradient id="ffGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1A18"/>
      <stop offset="100%" stop-color="#38332E"/>
    </linearGradient>
    <filter id="ffShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C04E24" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(6, 6)" filter="url(#ffShadow)">
    <!-- Outer Rounded Hexagon / Diamond -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#ffGradPrimary)" />
    
    <!-- Dynamic Double 'F' Flow Monogram for FleetFlow -->
    <!-- Primary F Stem & Upper Bar -->
    <path d="M15 15 L20 15 L20 38 L15 38 Z" fill="#FFFFFF"/>
    <path d="M19 15 L36 15 C38 15 39 16.5 38 18.5 L37 19.5 C36 20.5 34.5 21 32 21 L19 21 Z" fill="#FFFFFF"/>
    <!-- Secondary F Mid Bar Stream -->
    <path d="M19 26 L31 26 C33 26 34 27.5 33 29 L32 30 C31 31 29.5 31.5 27 31.5 L19 31.5 Z" fill="#FFE5D9"/>
    <!-- Flow Wave Chevron Accent -->
    <path d="M26 33 L36 24 L39 27 L29 36 Z" fill="#FFE5D9" fill-opacity="0.9"/>
    <!-- Flow Dot Accent -->
    <circle cx="40" cy="35" r="3" fill="#FFE5D9"/>
  </g>

  <!-- Typography: FleetFlow -->
  <text x="68" y="34" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="23" font-weight="900" letter-spacing="0.5" fill="#1C1A18">
    Fleet<tspan fill="#C04E24">Flow</tspan>
  </text>
  
  <!-- Subtitle: Mobility Platform -->
  <text x="69" y="48" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#78716C">
    MOBILITY CLOUD PLATFORM
  </text>
</svg>
