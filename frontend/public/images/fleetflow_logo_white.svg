<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="ffBrandGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#5B3DF5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="ffShadowDark" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(6, 6)" filter="url(#ffShadowDark)">
    <rect x="0" y="0" width="52" height="52" rx="15" fill="url(#ffBrandGradDark)" />
    <rect x="1" y="1" width="50" height="50" rx="14" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Dynamic Double 'F' Flow Monogram -->
    <path d="M14 14 L14 38" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M14 15 L36 15" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M14 26 L31 26" stroke="#DDD6FE" stroke-width="4" stroke-linecap="round"/>
    <!-- Flow Wave Chevron -->
    <path d="M26 33 L35 24 L39 28 L30 37 Z" fill="#DDD6FE"/>
    <circle cx="37" cy="15" r="2.5" fill="#A7F3D0"/>
  </g>

  <!-- Typography: FleetFlow for Dark Backgrounds -->
  <text x="70" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
    Fleet<tspan fill="#A855F7">Flow</tspan>
  </text>
  
  <!-- Subtitle: Mobility Platform -->
  <text x="71" y="48" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="#94A3B8">
    MOBILITY CLOUD PLATFORM
  </text>
</svg>
